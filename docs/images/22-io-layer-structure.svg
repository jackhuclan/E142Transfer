<svg viewBox="0 0 680 452" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
<title>WaferMapStudio.Io 层的文件结构与控制流</title>
<desc>点表加载器与强类型点位、映射表、控制器、传输抽象、模拟器的组成关系</desc>
<rect x="0" y="0" width="680" height="452" fill="#FFFFFF"/>
<text x="40" y="26" font-size="15" font-weight="500" fill="#2C2C2A">WaferMapStudio.Io 组成与控制流</text>

<rect x="40" y="44" width="285" height="150" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="68" font-size="13" font-weight="500" fill="#0C447C">配置输入</text>
<text x="56" y="94" font-size="12" fill="#185FA5">IOManager.json（64 点/8 模块）</text>
<text x="56" y="118" font-size="12" fill="#185FA5">IOManagerPointTable.Load()</text>
<text x="56" y="142" font-size="12" fill="#185FA5">· 过滤 26 个空占位 → 38 点</text>
<text x="56" y="166" font-size="12" fill="#185FA5">· IOPin 掩码 → bit = log2</text>
<text x="56" y="186" font-size="12" fill="#185FA5">· (名,方向) 绑定 IoPoint 枚举</text>

<rect x="355" y="44" width="285" height="150" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="371" y="68" font-size="13" font-weight="500" fill="#085041">契约与映射</text>
<text x="371" y="94" font-size="12" fill="#0F6E56">IoPoint 枚举（38 个强类型点位）</text>
<text x="371" y="118" font-size="12" fill="#0F6E56">IoPointDef：Bank/Bit/极性/原始字段</text>
<text x="371" y="142" font-size="12" fill="#0F6E56">IoPointMap：语义↔物理 O(1) 查表</text>
<text x="371" y="166" font-size="12" fill="#0F6E56">Decode/Encode/ApplyOutput</text>
<text x="371" y="186" font-size="12" fill="#0F6E56">SafeOutputStates() 安全态</text>

<path d="M325 119 L355 119" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" xmlns="http://www.w3.org/2000/svg"/>

<rect x="40" y="216" width="600" height="120" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="56" y="240" font-size="13" font-weight="500" fill="#3C3489">IoController（传输无关核心逻辑）</text>
<text x="56" y="264" font-size="12" fill="#534AB7">初始化：建链→校验型号→建镜像→输出归安全态→Ready</text>
<text x="56" y="288" font-size="12" fill="#534AB7">输入：读整帧→连续 N 帧去抖→变化沿 InputChanged；Read(point) 零 IO</text>
<text x="56" y="312" font-size="12" fill="#534AB7">输出：校验→极性编码→RMW 写→回读确认；批量按 Bank 合并掩码</text>

<path d="M340 336 L340 356" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" xmlns="http://www.w3.org/2000/svg"/>

<rect x="40" y="358" width="285" height="74" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="56" y="382" font-size="13" font-weight="500" fill="#633806">IIoTransport 抽象</text>
<text x="56" y="406" font-size="12" fill="#854F0B">ReadInputs / ReadOutputs / WriteBank</text>

<rect x="355" y="358" width="285" height="74" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="371" y="382" font-size="13" font-weight="500" fill="#444441">实现与释放</text>
<text x="371" y="406" font-size="12" fill="#5F5E5A">SimulatedIoTransport；轮询异常只上报</text>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
</svg>
