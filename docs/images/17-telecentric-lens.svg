<svg viewBox="0 0 680 290" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
<title>普通镜头与物方远心镜头对高度变化的响应</title>
<desc>普通镜头中物体高度变化导致像点漂移；物方远心镜头主光线平行于光轴，高度变化不引起放大率变化。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="290" fill="#FFFFFF"/>
<text x="40" y="30" font-size="15" font-weight="500" fill="#2C2C2A">远心镜头 vs 普通镜头：高度变化对放大率的影响</text>
<rect x="40" y="48" width="290" height="202" rx="12" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="185" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#501313">普通镜头</text>
<text x="185" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">放大率随高度变化</text>
<rect x="155" y="108" width="60" height="8" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
<rect x="145" y="140" width="80" height="12" rx="3" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<line x1="70" y1="220" x2="300" y2="220" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="180" y1="192" x2="300" y2="192" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="180" y1="192" x2="180" y2="220" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<path d="M225 220 L185 146 L145 112" fill="none" stroke="#BA7517" stroke-width="1.5"/>
<path d="M225 192 L185 146 L160 112" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<circle cx="145" cy="112" r="2.5" fill="#BA7517"/>
<circle cx="160" cy="112" r="2.5" fill="#D85A30"/>
<text x="205" y="130" font-size="12" fill="#A32D2D">像点漂移</text>
<text x="185" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">高度变化 → 尺寸漂移</text>
<rect x="350" y="48" width="290" height="202" rx="12" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="495" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">物方远心镜头</text>
<text x="495" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">主光线平行于光轴</text>
<rect x="465" y="108" width="60" height="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="455" y="140" width="80" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<line x1="380" y1="220" x2="610" y2="220" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="490" y1="192" x2="610" y2="192" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="490" y1="192" x2="490" y2="220" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="490" y1="220" x2="490" y2="112" stroke="#1D9E75" stroke-width="1.5"/>
<line x1="490" y1="192" x2="490" y2="112" stroke="#1D9E75" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="530" y1="220" x2="530" y2="112" stroke="#1D9E75" stroke-width="1.5"/>
<line x1="530" y1="192" x2="530" y2="112" stroke="#1D9E75" stroke-width="1" stroke-dasharray="3 2"/>
<circle cx="490" cy="112" r="2.5" fill="#0F6E56"/>
<circle cx="530" cy="112" r="2.5" fill="#0F6E56"/>
<text x="495" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">高度变化 → 尺寸不变</text>
</svg>
