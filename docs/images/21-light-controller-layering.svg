<svg viewBox="0 0 680 360" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
<title>可复用光源控制器的分层结构</title>
<desc>上层业务依赖 ILightController，LightController 统一做校验/状态/异常，再通过 ILightDeviceTransport 对接各类真机适配器与模拟器。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="360" fill="#FFFFFF"/>
<text x="40" y="28" font-size="15" font-weight="500" fill="#2C2C2A">可复用光源控制器：两层抽象</text>

<text x="40" y="60" font-size="12" font-weight="500" fill="#5F5E5A">上层业务（ViewModel / 检测流程）</text>
<rect x="40" y="70" width="600" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="90" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">仅依赖 ILightController：开灯 / 设亮度 / 查状态 / 批量配方</text>

<line x1="340" y1="110" x2="340" y2="132" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="134" width="600" height="100" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="60" y="156" font-size="13" font-weight="500" fill="#042C53">LightController（可复用，与硬件无关）</text>
<text x="60" y="178" font-size="12" fill="#185FA5">参数校验 · 连接状态机 · 亮度设定缓存 · 事件上报 · 异常归一化</text>
<rect x="60" y="192" width="174" height="30" rx="6" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="147" y="207" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">LightParameterValidator</text>
<rect x="246" y="192" width="160" height="30" rx="6" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="326" y="207" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">LightExceptions</text>
<rect x="418" y="192" width="202" height="30" rx="6" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="519" y="207" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">LightModels（中性命令/状态）</text>

<line x1="340" y1="234" x2="340" y2="256" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="356" y="249" font-size="12" fill="#5F5E5A">ILightDeviceTransport（唯一接缝）</text>

<rect x="40" y="258" width="600" height="82" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="60" y="280" font-size="13" font-weight="500" fill="#412402">设备适配层（各机型实现，换硬件只改这里）</text>
<rect x="60" y="292" width="132" height="34" rx="6" fill="#FFFFFF" stroke="#FAC775" stroke-width="0.5"/>
<text x="126" y="309" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">Serial 适配器</text>
<rect x="204" y="292" width="132" height="34" rx="6" fill="#FFFFFF" stroke="#FAC775" stroke-width="0.5"/>
<text x="270" y="309" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">TCP 适配器</text>
<rect x="348" y="292" width="132" height="34" rx="6" fill="#FFFFFF" stroke="#FAC775" stroke-width="0.5"/>
<text x="414" y="309" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">USB 适配器</text>
<rect x="492" y="292" width="128" height="34" rx="6" fill="#FFFFFF" stroke="#FAC775" stroke-width="0.5"/>
<text x="556" y="309" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">SimulatedDevice</text>
</svg>
