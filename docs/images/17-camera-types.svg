<svg viewBox="0 0 680 300" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
<title>面阵、线阵与 TDI 相机的成像方式</title>
<desc>面阵一次曝光整幅成像，线阵随运动逐行扫描，TDI 多行像素随图像同速累加。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<pattern id="gridBlue" width="16" height="16" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="14" height="14" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/></pattern>
<pattern id="gridLine" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="10" height="10" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/></pattern>
<pattern id="gridAmber" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="10" height="10" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/></pattern>
</defs>
<rect x="0" y="0" width="680" height="300" fill="#FFFFFF"/>
<text x="40" y="30" font-size="15" font-weight="500" fill="#2C2C2A">三种相机：面阵 / 线阵 / TDI</text>
<rect x="40" y="48" width="180" height="202" rx="12" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="130" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">面阵相机</text>
<text x="130" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">整幅一次曝光</text>
<rect x="67" y="112" width="126" height="78" fill="url(#gridBlue)"/>
<text x="130" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">定点 / 步进拍摄</text>
<rect x="240" y="48" width="180" height="202" rx="12" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="330" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">线阵相机</text>
<text x="330" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">逐行扫描拼接</text>
<rect x="259" y="150" width="142" height="10" fill="url(#gridLine)"/>
<line x1="270" y1="180" x2="390" y2="180" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="330" y="202" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">载台匀速运动</text>
<text x="330" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">大幅面连续扫描</text>
<rect x="440" y="48" width="180" height="202" rx="12" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="530" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#412402">TDI 相机</text>
<text x="530" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">多行同步累加</text>
<rect x="469" y="132" width="142" height="46" fill="url(#gridAmber)"/>
<line x1="480" y1="190" x2="600" y2="190" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="530" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">电荷与图像同速转移</text>
<text x="530" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">低照度高速扫描</text>
</svg>
