<svg width="680" height="330" viewBox="0 0 680 330" role="img" xmlns="http://www.w3.org/2000/svg">
<title>图案比较排除项与独立检测项的反向关系</title>
<desc>左侧是图案比较测试中的三个排除子项，右侧是对应的独立主动检测项，中间双向箭头表示同一结构对象在两种模式下被反向处理。</desc>
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;fill:#2C2C2A}
.ts{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:12px;fill:#5F5E5A}
.th{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text class="th" x="40" y="38" fill="#854F0B">图案比较 · 排除项</text>
<text class="th" x="410" y="38" fill="#0C447C">独立 · 主动检测项</text>
<rect x="40" y="56" width="230" height="54" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="th" x="55" y="78" fill="#633806">排除 Vias / Bumps / Bond Pads</text>
<text class="ts" x="55" y="97" fill="#854F0B">比较时屏蔽这些结构</text>
<rect x="40" y="136" width="230" height="54" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="th" x="55" y="158" fill="#633806">排除色差</text>
<text class="ts" x="55" y="177" fill="#854F0B">忽略色调差异，只比结构</text>
<rect x="40" y="216" width="230" height="54" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="th" x="55" y="238" fill="#633806">排除无图案的 ROI</text>
<text class="ts" x="55" y="257" fill="#854F0B">跳过空白区域</text>
<rect x="410" y="56" width="230" height="54" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="425" y="78" fill="#0C447C">Via 检测 / Bump 检测</text>
<text class="ts" x="425" y="97" fill="#185FA5">主动查通孔与凸点缺陷</text>
<rect x="410" y="136" width="230" height="54" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="425" y="158" fill="#0C447C">色差检测</text>
<text class="ts" x="425" y="177" fill="#185FA5">主动查颜色偏差</text>
<rect x="410" y="216" width="230" height="54" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="425" y="238" fill="#0C447C">无图案的 ROI 检测</text>
<text class="ts" x="425" y="257" fill="#185FA5">主动查空白区污染异物</text>
<path d="M274 83 L406 83" fill="none" stroke="#888780" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M274 163 L406 163" fill="none" stroke="#888780" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M274 243 L406 243" fill="none" stroke="#888780" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="40" y="306" fill="#5F5E5A">同一结构：屏蔽它 → 避免误报；检测它 → 发现缺陷。勾选哪一侧，取决于把它当噪声还是当目标。</text>
</svg>