<svg viewBox="0 0 680 334" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
<title>光源控制器的内部模块与外部接口</title>
<desc>控制器内部包含恒流驱动、通道矩阵、触发与定时、通信与保护四类模块，外部连接上位机、LED 光源、相机和直流电源。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="334" fill="#FFFFFF"/>
<text x="40" y="30" font-size="15" font-weight="500" fill="#2C2C2A">光源控制器：内部模块与外部接口</text>
<rect x="40" y="44" width="390" height="286" rx="22" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="60" y="70" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">光源控制器（内部）</text>
<rect x="60" y="86" width="168" height="100" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="144" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#412402">恒流驱动 × 多路</text>
<text x="144" y="146" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">每路独立电流</text>
<rect x="242" y="86" width="168" height="100" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="326" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">通道矩阵</text>
<text x="326" y="146" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">明场/暗场/多角度</text>
<rect x="60" y="206" width="168" height="100" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="144" y="244" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">触发与定时</text>
<text x="144" y="266" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">延时/脉宽/序列</text>
<rect x="242" y="206" width="168" height="100" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="326" y="244" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#412402">通信与保护</text>
<text x="326" y="266" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">指令/回读/报警</text>
<rect x="470" y="60" width="170" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="555" y="82" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">上位机 / 面板</text>
<rect x="470" y="130" width="170" height="44" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="555" y="152" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#412402">LED 光源</text>
<rect x="470" y="200" width="170" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="555" y="222" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">相机 / 编码器</text>
<rect x="470" y="270" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="555" y="292" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">DC 电源</text>
<line x1="468" y1="82" x2="434" y2="82" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="434" y1="152" x2="468" y2="152" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="468" y1="222" x2="434" y2="222" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="468" y1="292" x2="434" y2="292" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="451" y="72" text-anchor="middle" font-size="12" fill="#5F5E5A">指令</text>
<text x="451" y="142" text-anchor="middle" font-size="12" fill="#5F5E5A">驱动</text>
<text x="451" y="212" text-anchor="middle" font-size="12" fill="#5F5E5A">触发</text>
<text x="451" y="282" text-anchor="middle" font-size="12" fill="#5F5E5A">供电</text>
</svg>
