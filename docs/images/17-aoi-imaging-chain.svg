<svg viewBox="0 0 680 250" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
<title>晶圆 AOI 光学成像链路</title>
<desc>LED 光源照射晶圆，经远心镜头与滤光片轮到达相机；光源控制器负责通道选通与曝光同步。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="250" fill="#FFFFFF"/>
<text x="40" y="30" font-size="15" font-weight="500" fill="#2C2C2A">晶圆 AOI 光学成像链路：照明 → 成像 → 采集 → 同步</text>
<rect x="40" y="48" width="104" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="92" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#412402">LED 光源</text>
<text x="92" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">多通道明暗场</text>
<rect x="160" y="48" width="104" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="212" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">晶圆表面</text>
<text x="212" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">反射与散射</text>
<rect x="280" y="48" width="104" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="332" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">远心镜头</text>
<text x="332" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">正交投影</text>
<rect x="400" y="48" width="104" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="452" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">滤光片轮</text>
<text x="452" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">选择波段</text>
<rect x="520" y="48" width="104" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="572" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">相机</text>
<text x="572" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">面阵/线阵/TDI</text>
<line x1="144" y1="76" x2="158" y2="76" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="264" y1="76" x2="278" y2="76" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="384" y1="76" x2="398" y2="76" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="504" y1="76" x2="518" y2="76" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M270 150 L94 106" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M410 150 L570 106" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="106" y="138" font-size="12" fill="#5F5E5A">通道选通</text>
<text x="522" y="138" font-size="12" fill="#5F5E5A">曝光触发</text>
<rect x="230" y="150" width="220" height="50" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="168" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">光源控制器</text>
<text x="340" y="187" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">恒流驱动 · 频闪 · 曝光同步</text>
