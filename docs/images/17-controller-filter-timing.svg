<svg viewBox="0 0 680 250" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
<title>多通道采集的协同时序</title>
<desc>滤光片轮先到位，控制器选通 LED 通道，频闪与曝光同步，采集完成后切换到下一通道。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="250" fill="#FFFFFF"/>
<text x="40" y="30" font-size="15" font-weight="500" fill="#2C2C2A">滤光片轮 + 光源控制器的协同采集时序</text>
<rect x="40" y="60" width="132" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="106" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">滤光片轮到位</text>
<text x="106" y="99" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">机械切换先完成</text>
<rect x="196" y="60" width="132" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="262" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">选通 LED 通道</text>
<text x="262" y="99" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">恒流驱动 + 切通道</text>
<rect x="352" y="60" width="132" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="418" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#412402">频闪与曝光同步</text>
<text x="418" y="99" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">脉冲覆盖曝光窗口</text>
<rect x="508" y="60" width="132" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="574" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">采集并切换</text>
<text x="574" y="99" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">多帧分别处理</text>
<line x1="172" y1="88" x2="194" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="328" y1="88" x2="350" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="484" y1="88" x2="506" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="40" y="155" font-size="12" fill="#5F5E5A">触发源：相机曝光信号或运动编码器；通道间须等待光源与滤光片稳定。</text>
<text x="40" y="180" font-size="12" fill="#5F5E5A">稳光：恒流驱动配合光反馈，抑制 LED 温漂，保证多帧灰度一致性。</text>
</svg>
